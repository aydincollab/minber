name: minber
description: Hutbe & Namaz Vakitleri Uygulaması - Prayer times and sermon application

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  
  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0
  
  # Fonts
  google_fonts: ^6.1.0
  
  # Location
  geolocator: ^11.0.0
  geocoding: ^2.1.1
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Date/Time
  intl: ^0.19.0
  
  # Animations
  flutter_animate: ^4.5.0
  
  # Ads (placeholder)
  google_mobile_ads: ^4.0.0
  
  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Assets
  # assets:
  #   - assets/images/
  #   - assets/icons/
