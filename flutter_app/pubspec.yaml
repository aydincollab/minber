name: minber
description: Hutbe & Namaz Vakitleri Uygulaması - Prayer times and sermon application

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  
  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0
  
  # Fonts
  google_fonts: ^6.1.0
  
  # Location
  geolocator: ^11.0.0
  geocoding: ^2.1.1
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Date/Time
  intl: ^0.19.0
  
  # Animations
  flutter_animate: ^4.5.0
  
  
  # UI
  cupertino_icons: ^1.0.6
  
  # Text-to-Speech
  flutter_tts: ^4.0.2
  
  # Local Database
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  
  # Sharing
  share_plus: ^7.2.1
  
  # Connectivity
  connectivity_plus: ^6.1.0
  
  # Shimmer effects
  shimmer: ^3.0.0
  
  # Lottie animations
  lottie: ^3.1.0
  
  # Package info
  package_info_plus: ^9.0.0
  
  # Notifications (Ezan vakti bildirimleri)
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4

  
  # Screenshot / Quote card sharing
  screenshot: ^3.0.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/app_icon.jpg"
  remove_alpha_ios: true




flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/animations/
    - assets/images/
